spring.application.name=helpdesk
server.port=8081
helpdesk.user-service-url=${USER_SERVICE_URL:http://localhost:8083}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/helpdesk_db}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:rootpassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=${DATABASE_SCHEMA:ticket_schema}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
helpdesk.rabbitmq.exchange=${RABBITMQ_EXCHANGE:helpdesk.events}
helpdesk.rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:ticket.technician.assign}
helpdesk.rabbitmq.response-routing-key=${RABBITMQ_RESPONSE_ROUTING_KEY:user.technician.assignment.result}
helpdesk.rabbitmq.ticket-assigned-routing-key=${RABBITMQ_TICKET_ASSIGNED_ROUTING_KEY:ticket.assigned}
helpdesk.rabbitmq.ticket-created-routing-key=${RABBITMQ_TICKET_CREATED_ROUTING_KEY:ticket.created}
helpdesk.rabbitmq.ticket-status-changed-routing-key=${RABBITMQ_TICKET_STATUS_CHANGED_ROUTING_KEY:ticket.status.changed}