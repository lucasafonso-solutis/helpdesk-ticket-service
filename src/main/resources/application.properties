spring.application.name=helpdesk
server.port=8081

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ticket_db}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:rootpassword}

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
helpdesk.rabbitmq.exchange=${RABBITMQ_EXCHANGE:helpdesk.events}
helpdesk.rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:user.technician.find}
spring.rabbitmq.template.reply-timeout=${RABBITMQ_REPLY_TIMEOUT:5000}